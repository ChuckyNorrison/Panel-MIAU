<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Egzaminacyjny MIAU - NKW</title>
    <style>
        :root {
            --primary: #e67e22;
            --primary-hover: #d35400;
            --secondary: #34495e;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #dcdde1;
            --btn-correct: #27ae60;
            --btn-neutral: #f1c40f;
            --btn-wrong: #c0392b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        h2.stage-title {
            color: var(--secondary);
            border-left: 4px solid var(--primary);
            padding-left: 10px;
            background: #ecf0f1;
            padding: 10px;
            border-radius: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }

        select, input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button.main-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 15px;
        }

        button.main-btn:hover {
            background-color: var(--primary-hover);
        }

        button.next-btn {
            background-color: var(--secondary);
            margin-top: 25px;
        }

        button.next-btn:hover {
            background-color: #2c3e50;
        }

        .question-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .question-text {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .answer-text {
            font-style: italic;
            margin-bottom: 15px;
            color: #34495e;
        }

        .grading-buttons {
            display: flex;
            gap: 10px;
        }

        .grading-buttons button {
            flex: 1;
            padding: 10px;
            border: 2px solid transparent;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            background-color: #ecf0f1;
            color: var(--text-color);
        }

        .grading-buttons button.selected-correct { background-color: var(--btn-correct); color: white; }
        .grading-buttons button.selected-neutral { background-color: var(--btn-neutral); color: #2c3e50; }
        .grading-buttons button.selected-wrong { background-color: var(--btn-wrong); color: white; }

        #result-section {
            margin-top: 30px;
            padding: 20px;
            background-color: #fff9e6;
            border-left: 5px solid var(--primary);
            border-radius: 5px;
            display: none;
        }

        #command-output {
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
        }

        .copy-btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .copy-btn:hover {
            background-color: #1a252f;
        }

        .error {
            color: var(--btn-wrong);
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
        }

        .stage-container {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Panel Egzaminacyjny MIAU - NKW</h1>
    
    <div id="setup-section">
        <div class="form-group">
            <label for="examinee-name">Nazwa osoby egzaminowanej:</label>
            <input type="text" id="examinee-name" placeholder="np. Chucky Norrison">
        </div>

        <div class="form-group">
            <label for="rank-select">Wybierz stopień osoby egzaminowanej:</label>
            <select id="rank-select">
                <option value="">-- Wybierz stopień --</option>
                <option value="1">1 - Praktykant</option>
                <option value="2">2 - Stażysta</option>
                <option value="3">3 - Młodszy Pielęgniarz / Młodszy Ratownik Medyczny</option>
                <option value="4">4 - Pielęgniarz / Ratownik Medyczny</option>
                <option value="5">5 - Starszy Pielęgniarz / Starszy Ratownik Medyczny</option>
                <option value="6">6 - Pielęgniarz Oddziałowy / Dyżurny Ratownik Medyczny</option>
                <option value="7">7 - Pielęgniarz Specjalista / Ratownik Medyczny Specjalista</option>
                <option value="8">8 - Rezydent</option>
                <option value="9">9 - Asystent Lekarza</option>
                <option value="10">10 - Lekarz</option>
                <option value="11">11 - Starszy Lekarz</option>
                <option value="12">12 - Lekarz Dyżurny</option>
                <option value="13">13 - Lekarz Specjalista</option>
            </select>
        </div>

        <button class="main-btn" id="start-btn" onclick="startExam()">Rozpocznij egzamin</button>
    </div>

    <div id="error-msg" class="error"></div>

    <!-- ETAP 1 -->
    <div id="stage-1" class="stage-container">
        <h2 class="stage-title">Etap 1 z 3: Regulamin (4 pytania)</h2>
        <div id="stage-1-questions"></div>
        <button class="main-btn next-btn" onclick="nextStage(1)">Przejdź do Etapu 2 (Kody Radiowe)</button>
    </div>

    <!-- ETAP 2 -->
    <div id="stage-2" class="stage-container">
        <h2 class="stage-title">Etap 2 z 3: Kody Radiowe i Statusy (4 pytania)</h2>
        <div id="stage-2-questions"></div>
        <button class="main-btn next-btn" onclick="nextStage(2)">Przejdź do Etapu 3 (Wiedza Medyczna)</button>
    </div>

    <!-- ETAP 3 -->
    <div id="stage-3" class="stage-container">
        <h2 class="stage-title">Etap 3 z 3: Wiedza Medyczna (10 pytań)</h2>
        <div id="stage-3-questions"></div>
        <button class="main-btn next-btn" style="background-color: var(--primary);" onclick="finishExam()">Zakończ egzamin i podlicz wyniki</button>
    </div>

    <!-- WYNIKI -->
    <div id="result-section">
        <h3>Wynik egzaminu</h3>
        <p id="score-text"></p>
        <label>Komenda do skopiowania:</label>
        <textarea id="command-output" readonly rows="4"></textarea>
        <button class="copy-btn" onclick="copyCommand()">Skopiuj komendę</button>
        <button class="copy-btn" style="background-color: #7f8c8d; margin-left: 10px;" onclick="location.reload()">Zresetuj narzędzie</button>
    </div>
</div>

<script>
    const dbRegulamin = [
        {q: "Jakie są kolejności udzielania pomocy?", a: "Zarząd EMS, Medyk EMS, HC LSPD, S.W.A.T, Funkcjonariusz LSPD, Cywile."},
        {q: "Ile może trwać 10-75?", a: "Maksymalnie pół godziny."},
        {q: "W jakich godzinach Egzaminator FTM lub psycholog ma prawo odmówić wykonania szkolenia/KPP/badań psychologicznych?", a: "Od 23:00 do 6:00."},
        {q: "Kiedy kwalifikacja może zostać zabrana?", a: "Za czyn, który stwierdza o tym, że pracownik nie umie posługiwać się daną kwalifikacją."},
        {q: "Kiedy medyk ma prawo mieć ubraną kamizelkę?", a: "Kod Czerwony (Patrole), Kod Czarny (Szpital i patrole)."},
        {q: "Kiedy można posiadać Broń Palną?", a: "Od rangi Mł. Pielęgniarza / Mł. Rat Med jeśli posiada się licencję."},
        {q: "Za co można zdobyć awans?", a: "Za plusy, przez akademię lub za decyzją zarządu."},
        {q: "Jakie są kary za brak aktywności?", a: "1. tydzień - Upomnienie, 2. tydzień - Minus, 3. tydzień - Degradacja, 4. tydzień - Wydalenie z frakcji (LOTA)."},
        {q: "Podaj zasady redukowania kar?", a: "1 Plus = 1 Upomnienie, 2 Plusy = 1 Minus, 4 Plusy = 1 Ostrzeżenie."},
        {q: "Czy pielęgniarze mogą wyjeżdżać na patrol?", a: "Mogą wyjechać na patrol, jeżeli jest mniej niż 2 ratowników."},
        {q: "Czy można mieć broń białą na służbie?", a: "Nie, jest zakazana (wyjątkiem jest pałka dla SMS)."},
        {q: "Czym zajmuje się podjednostka SAR?", a: "Działania ratownicze i poszukiwawcze poza terenem Los Santos (np. użycie helikopterów i terenówek)."},
        {q: "Czym zajmuje się podjednostka FTM?", a: "Zdawanie kwalifikacji, kształcenie i szkolenie przyszłych pokoleń medyków."},
        {q: "Czym zajmuje się podjednostka MIAU?", a: "Kontrolowanie pracowników (szpital/teren), nagłe kontrole wiedzy, nadzorowanie regulaminu."},
        {q: "Co to jest C8 i do czego służy?", a: "Kod ósmy (rozdzielenie medyków na patrole i dyżury na szpitalu). Można wykonać, gdy jest min. 8 osób na duty."}
    ];

    const dbKody = [
        {q: "Co oznacza kod 10-04?", a: "Przyjąłem."},
        {q: "Co oznacza kod 10-01?", a: "Do wszystkich jednostek."},
        {q: "Co oznacza kod 10-06?", a: "Zajęty."},
        {q: "Co oznacza kod 10-14?", a: "Ranny Obywatel."},
        {q: "Co oznacza kod 10-19?", a: "Powrót na szpital."},
        {q: "Co oznacza kod 10-02?", a: "Potwierdzam."},
        {q: "Co oznacza kod 10-08?", a: "Potrzebne wsparcie."},
        {q: "Co oznacza kod 10-13?", a: "Ranny Funkcjonariusz."},
        {q: "Co oznacza status 2?", a: "Przerwa na służbie."},
        {q: "Co oznacza status 4?", a: "Rozpoczęcie patrolu."},
        {q: "Co oznacza status 7?", a: "Dyżur na szpitalu."},
        {q: "Co oznacza status 8?", a: "Powrót z rannym/rannymi na szpital."},
        {q: "Co oznacza status 10?", a: "Przejście na służbę SAR."},
        {q: "Co oznacza Kod 1?", a: "Wyjazd pilny (z użyciem sygnałów świetlnych i dźwiękowych)."},
        {q: "Co oznacza Kod 2?", a: "Wyjazd niepilny (bez sygnałów)."},
        {q: "Co oznacza Kod 3?", a: "Transport medyczny planowy (bez sygnałów)."},
        {q: "Co oznacza Kod 4?", a: "Transport medyczny z użyciem sygnałów."},
        {q: "Co oznacza 10-75?", a: "Interwencja własna."},
        {q: "Co oznacza 10-11?", a: "Wezwanie radiowe od LSPD."},
        {q: "Co oznacza K1?", a: "Nagłe zdarzenie medyczne (np. zawał, ciężki wypadek)."},
        {q: "Co oznacza K2?", a: "Pilna pomoc medyczna."},
        {q: "Co oznacza K3?", a: "Niepilne zdarzenie (konsultacja w domu)."}
    ];

    const dbMedycyna = {
        "2": [
            {q: "Jaki sprzęt służy do udrażniania dróg oddechowych pacjenta w stanach nagłych?", a: "Rurki ustno-gardłowe, maski krtaniowe, rurki intubacyjne, laryngoskopy oraz worki samorozprężalne (Ambu)."},
            {q: "Do czego służy ssak medyczny będący na wyposażeniu przedziału medycznego?", a: "Do mechanicznego oczyszczania jamy ustnej i dróg oddechowych z płynów, krwi, śluzu lub treści żołądkowej."},
            {q: "Do czego służy respirator transportowy znajdujący się na wyposażeniu karetki?", a: "Służy do prowadzenia automatycznej, mechanicznej wentylacji płuc u pacjentów niewydolnych oddechowo."},
            {q: "Do czego służy deska ortopedyczna?", a: "Do unieruchomienia, stabilizacji oraz transportu pacjenta."},
            {q: "Jaki sprzęt służy do unieruchamiania złamań kończyn na miejscu zdarzenia?", a: "Szyny unieruchamiające (np. Kramera, Splint, próżniowe, pneumatyczne)."},
            {q: "Czym jest urządzenie AED i do czego służy?", a: "Automatyczny Defibrylator Zewnętrzny - analizuje rytm i w razie potrzeby przywraca pracę serca impulsem. Służy przy NZK."},
            {q: "Do czego służy glukometr?", a: "Do szybkiego oznaczenia stężenia glukozy we krwi (diagnoza hipo/hiperglikemii)."},
            {q: "Jakie jest prawidłowe (książkowe) ciśnienie krwi u dorosłego człowieka?", a: "120/80 mmHg"},
            {q: "W jaki sposób można podać tlen pacjentowi z zachowanym oddechem własnym?", a: "Przez maskę tlenową, wąsy tlenowe podłączone do instalacji, lub bezpośrednio z butli."},
            {q: "Wymień minimum 3 drogi podawania leków.", a: "I.V. (dożylnie), P.O. (doustnie), I.M. (domięśniowo), P.I. (wziewnie), itd."},
            {q: "Na jakie rodzaje dzielą się leki przeciwbólowe?", a: "Nieopioidowe, NLPZ (niesteroidowe leki przeciwzapalne), Opioidy."},
            {q: "Wymień 3 rodzaje leków OPIOIDOWYCH i ich dawki:", a: "Np. Morfina (2.5-10mg), Fentanyl (50-100µg), Tramadol (50-100mg)."},
            {q: "Wymień 3 leki PRZECIWBÓLOWE (podstawowe) i ich dawki:", a: "Np. Paracetamol (500-1000mg), Ibuprofen (200-400mg), Ketoprofen (25-100mg)."},
            {q: "Wymień 3 leki PRZECIWKRWOTOCZNE i ich dawki:", a: "Np. Cyclonamine (250mg), TXA (1000mg), Etamsylat (250-300mg)."},
            {q: "Wymień 3 sposoby zbadania tętna u człowieka:", a: "Na tętnicy szyjnej, promieniowej, udowej, ramiennej."},
            {q: "Jakie jest tętno spoczynkowe u przeciętnej osoby dorosłej?", a: "Od około 60 do 100 uderzeń na minutę."},
            {q: "Wymień 1 lek regulujący tętno, podaj jego dawkę oraz działanie.", a: "Np. Adrenalina (1mg I.v. - przyspiesza bicie serca), Metoprolol (5mg I.v. - spowalnia), Atropina (0.5-1mg I.v. - przyspiesza)."},
            {q: "Czym jest narkoza?", a: "Znieczulenie ogólne. Całkowita, odwracalna utrata świadomości uzyskana dzięki lekom anestetycznym."},
            {q: "Wymień 3 leki stosowane do narkozy:", a: "Fentanyl+Midazolam, Etomidat, Propofol, Tiopental."},
            {q: "Czym jest rana postrzałowa styczna?", a: "Pocisk przemieszcza się równolegle do ciała, ocierając się o nie, bez penetracji w głąb."},
            {q: "Jakie są rodzaje złamań?", a: "Otwarte, zamknięte bez przemieszczenia, zamknięte z przemieszczeniem."},
            {q: "Ile jest stopni skręceń?", a: "3 stopnie."},
            {q: "Czym jest RKO?", a: "Resuscytacja krążeniowo-oddechowa (30 uciśnięć, 2 wdechy)."},
            {q: "Czym jest badanie ABCDE?", a: "A - Airway, B - Breathing, C - Circulation, D - Disability, E - Exposure."},
            {q: "Co to Kardiomonitor i do czego służy?", a: "Urządzenie do ciągłego monitorowania parametrów (EKG, tętno, ciśnienie, saturacja)."},
            {q: "Czym jest RTG?", a: "Badanie rentgenowskie, prześwietlenie tworzące dwuwymiarowy obraz struktur wewnętrznych."},
            {q: "Czym jest USG?", a: "Badanie ultrasonograficzne oceniające struktury narządów w czasie rzeczywistym."}
        ],
        "3": [
            {q: "Co to jest AVPU?", a: "Skala oceny świadomości (Alert, Voice, Pain, Unresponsive)."},
            {q: "Co to jest zasada PRICE?", a: "Protokół leczenia urazów (Odpoczynek, Lód, Ucisk, Uniesienie)."},
            {q: "Podaj 2 leki uspokajające.", a: "Midazolam, diazepam."},
            {q: "Podaj 2 płyny nawadniające.", a: "NaCl 0,9%, płyn Ringera."},
            {q: "Co to jest kaniula (wenflon)?", a: "Przyrząd do uzyskania dostępu dożylnego."},
            {q: "Co to jest narkoza?", a: "Stan znieczulenia ogólnego."},
            {q: "Podaj 2 leki do wprowadzenia do narkozy.", a: "Propofol, tiopental."},
            {q: "Co to jest narkoza wziewna i podaj 2 leki?", a: "Znieczulenie gazowe. Leki: sewofluran, izofluran."},
            {q: "Co to jest znieczulenie domiejscowe i podaj 2 leki?", a: "Blokada bólu w wybranym obszarze. Leki: lidokaina, bupiwakaina."},
            {q: "Co to są leki przeciwzakrzepowe i podaj 2 leki?", a: "Środki hamujące krzepnięcie. Leki: heparyna, enoksaparyna."},
            {q: "Co to jest Triage?", a: "System segregacji poszkodowanych według pilności."},
            {q: "Co to jest test FAST?", a: "Szybka ocena udaru mózgu."},
            {q: "Co to jest intubacja?", a: "Wprowadzenie rurki do tchawicy."},
            {q: "Wymień 5 rzeczy w karetce.", a: "Defibrylator, nosze, zestaw tlenowy, torba ratownicza (R1), deska ortopedyczna."},
            {q: "Co to są drogi podawania leków? Podaj 5 dróg.", a: "Sposoby wprowadzenia leku. Doustna, dożylna, domięśniowa, podskórna, wziewna."},
            {q: "Co to są leki przeciwbólowe i podaj 2 leki?", a: "Uśmierzające ból. Np. paracetamol, ibuprofen."},
            {q: "Co to jest RKO u dorosłych?", a: "Resuscytacja (30 uciśnięć, 2 oddechy)."},
            {q: "Co to jest pierwsza pomoc?", a: "Czynności ratujące życie przed przybyciem służb."},
            {q: "Co to są rurki UG?", a: "Rurki ustno-gardłowe udrażniające drogi oddechowe."},
            {q: "Jakie są trzy główne cele stosowania kaniuli dożylnej (wenflonu)?", a: "Podawanie leków, podawanie płynów infuzyjnych, pobieranie krwi."},
            {q: "Jakie są dwie główne zalety narkozy wziewnej?", a: "Szybka kontrola głębokości znieczulenia oraz szybkie wybudzenie po odstawieniu gazu."},
            {q: "Dlaczego przy podejrzeniu urazu kręgosłupa nie można unosić głowy poszkodowanego?", a: "Ryzyko przerwania rdzenia kręgowego lub pogłębienia uszkodzeń kręgów."},
            {q: "Jakie są 3 fazy reakcji organizmu na wychłodzenie (hipotermię)?", a: "Drżenie mięśniowe, spowolnienie procesów metabolicznych, utrata przytomności/zatrzymanie krążenia."},
            {q: "Co ocenia parametr 'A' w skali AVPU?", a: "Czy pacjent jest w pełni przytomny i zorientowany (Alert)."}
        ],
        "4": [
            {q: "Podaj syrop na kaszel, wykrztuśny?", a: "Envil."},
            {q: "Podaj lek stosowany przy atakach astmy lub dusznościach?", a: "Aminofilina / Fenoterol."},
            {q: "Steryd stosowany przy atakach astmy (dawka i sposób)?", a: "Salbutamol (wziewnie)."},
            {q: "Co to jest stapler?", a: "Przyrząd do zakładania szwów mechanicznych, przyspieszający operację i zapewniający szczelność."},
            {q: "Czym się różni żyła od tętnicy?", a: "Żyła ma zastawki i mniejsze ciśnienie; tętnica ma grube ściany i jasną, utlenioną krew."},
            {q: "Co to jest urazówka?", a: "Badanie poszkodowanego pod kątem urazów."},
            {q: "Jakie leki stosuje się w przypadku drgawek?", a: "Benzodiazepiny (np. diazepam, midazolam)."},
            {q: "Na czym polega różnica w postępowaniu przy ranie rąbanej a kąsanej?", a: "Rąbana wymaga szybkiego tamowania krwotoku, a kąsana dokładnego oczyszczenia i profilaktyki przeciwszczepiennej."},
            {q: "Co oznacza 'trzeci' i 'czwarty' stopień w kontekście odmrożeń?", a: "Trzeci to martwica skóry i tkanek podskórnych, czwarty to martwica obejmująca mięśnie i kości."},
            {q: "Co to jest przeszczep skóry i kiedy się go wykonuje?", a: "Procedura pokrycia ubytku własną tkanką, stosowana przy rozległych oparzeniach."},
            {q: "Jaka jest różnica między ALS a BLS?", a: "BLS to zabiegi podstawowe (bez sprzętu), ALS to zabiegi zaawansowane (z lekami i defibrylatorem)."},
            {q: "Co oceniamy w skali AVPU?", a: "Poziom przytomności: A-Alert, V-Voice, P-Pain, U-Unresponsive."},
            {q: "Jakie są metody tamowania krwotoku zewnętrznego?", a: "Bezpośredni ucisk, opatrunek uciskowy, opaska uciskowa (staza)."},

    let s1Qs = [], s2Qs = [], s3Qs = [];
    let s1Pts = [], s2Pts = [], s3Pts = [];

    function startExam() {
        const nameInput = document.getElementById('examinee-name').value.trim();
        const rankSelect = document.getElementById('rank-select').value;
        const errorMsg = document.getElementById('error-msg');

        if (!nameInput || !rankSelect) {
            errorMsg.innerText = 'Podaj nazwę osoby egzaminowanej oraz wybierz stopień!';
            return;
        }

        errorMsg.innerText = '';
        
        s1Pts = new Array(4).fill(null);
        s2Pts = new Array(4).fill(null);
        s3Pts = new Array(10).fill(null);

        s1Qs = [...dbRegulamin].sort(() => 0.5 - Math.random()).slice(0, 4);
        renderStageContent('stage-1-questions', s1Qs, 's1', 0.5);

        s2Qs = [...dbKody].sort(() => 0.5 - Math.random()).slice(0, 4);
        renderStageContent('stage-2-questions', s2Qs, 's2', 0.5);

        const rankNum = parseInt(rankSelect);
        let medPool = [];
        for (let i = 2; i <= Math.max(2, Math.min(rankNum, 8)); i++) {
            medPool = medPool.concat(dbMedycyna[i.toString()]);
        }
        if (rankNum >= 9) medPool = medPool.concat(dbMedycyna["9-13"]);
        s3Qs = [...medPool].sort(() => 0.5 - Math.random()).slice(0, 10);
        renderStageContent('stage-3-questions', s3Qs, 's3', 1);

        document.getElementById('setup-section').style.display = 'none';
        document.getElementById('stage-1').style.display = 'block';
    }

    function renderStageContent(containerId, questionsArray, prefix, maxPoints) {
        let html = '';
        const neutralPoints = maxPoints / 2;
        questionsArray.forEach((item, index) => {
            html += `
                <div class="question-card">
                    <div class="question-text">${index + 1}. ${item.q}</div>
                    <div class="answer-text"><strong>Oczekiwana odpowiedź:</strong> ${item.a}</div>
                    <div class="grading-buttons">
                        <button type="button" onclick="setPoint('${prefix}', ${index}, ${maxPoints}, 'correct', this)">Poprawna (${maxPoints} pkt)</button>
                        <button type="button" onclick="setPoint('${prefix}', ${index}, ${neutralPoints}, 'neutral', this)">Neutral (${neutralPoints} pkt)</button>
                        <button type="button" onclick="setPoint('${prefix}', ${index}, 0, 'wrong', this)">Błędna (0 pkt)</button>
                    </div>
                </div>
            `;
        });
        document.getElementById(containerId).innerHTML = html;
    }

    function setPoint(stagePrefix, index, points, type, btnElement) {
        if (stagePrefix === 's1') s1Pts[index] = points;
        if (stagePrefix === 's2') s2Pts[index] = points;
        if (stagePrefix === 's3') s3Pts[index] = points;
        
        const parent = btnElement.parentElement;
        parent.querySelectorAll('button').forEach(b => {
            b.classList.remove('selected-correct', 'selected-neutral', 'selected-wrong');
        });

        btnElement.classList.add('selected-' + type);
    }

    function nextStage(currentStage) {
        const errorMsg = document.getElementById('error-msg');
        if (currentStage === 1 && s1Pts.includes(null)) { errorMsg.innerText = 'Oceń pytania z Etapu 1!'; return; }
        if (currentStage === 2 && s2Pts.includes(null)) { errorMsg.innerText = 'Oceń pytania z Etapu 2!'; return; }
        
        errorMsg.innerText = '';
        document.getElementById('stage-'+currentStage).style.display = 'none';
        document.getElementById('stage-'+(currentStage+1)).style.display = 'block';
        window.scrollTo(0, 0);
    }

    function finishExam() {
        const errorMsg = document.getElementById('error-msg');
        if (s3Pts.includes(null)) { errorMsg.innerText = 'Oceń wszystkie 10 pytań z Etapu 3!'; return; }
        
        const totalPoints = s1Pts.reduce((a, b) => a + b, 0) + s2Pts.reduce((a, b) => a + b, 0) + s3Pts.reduce((a, b) => a + b, 0);
        const maxPoints = 14; 
        const percent = (totalPoints / maxPoints) * 100;

        let verdict = (percent === 100) ? "plus" : (percent >= 50) ? "neutral" : "minus";

        const allQuestions = [...s1Qs, ...s2Qs, ...s3Qs];
        const topicsStr = allQuestions.map(item => item.q).join(" | ");
        const examineeName = document.getElementById('examinee-name').value.trim();
        const finalCommand = `/kontrola kogo:${examineeName} temat: ${topicsStr} werdykt: ${verdict}`;

        document.getElementById('score-text').innerHTML = `Zdobyte punkty: <strong>${totalPoints} / ${maxPoints} (${percent.toFixed(0)}%)</strong><br>Ostateczny wynik: <strong>${verdict.toUpperCase()}</strong>`;
        document.getElementById('command-output').value = finalCommand;
        document.getElementById('result-section').style.display = 'block';
        document.getElementById('stage-3').style.display = 'none';
        window.scrollTo(0, 0);
    }

    function copyCommand() {
        const copyText = document.getElementById("command-output");
        copyText.select();
        navigator.clipboard.writeText(copyText.value).then(() => alert("Skopiowano!"));
    }
</script>
