<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zarządzanie bazą pytań — MIAU</title>
<link rel="stylesheet" href="/style.css">
<style>
  .admin-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
  .admin-header h1 { border: none; padding: 0; margin: 0; }
  .admin-header .actions { display: flex; gap: 10px; }
  .admin-header a, .admin-header button { background: var(--secondary); color: #fff; padding: 8px 12px; border-radius: 5px; text-decoration: none; border: none; cursor: pointer; font-weight: bold; font-size: 14px; }
  .admin-header .danger { background: #c0392b; }
  .filters { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
  .filters select, .filters input { flex: 1; min-width: 150px; padding: 8px; border: 1px solid var(--border-color); border-radius: 5px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border-color); vertical-align: top; }
  th { background: #ecf0f1; position: sticky; top: 0; }
  .tag { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; color: #fff; }
  .tag.regulamin { background: #2980b9; } .tag.kody { background: #8e44ad; } .tag.medycyna { background: #27ae60; }
  .row-actions button { padding: 4px 8px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; margin-right: 4px; }
  .row-actions .edit { background: #f39c12; color: #fff; } .row-actions .del { background: #c0392b; color: #fff; }
  .modal-bg { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: flex-start; padding: 40px 20px; overflow-y: auto; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; padding: 25px; border-radius: 10px; max-width: 700px; width: 100%; }
  .modal h3 { margin-top: 0; color: var(--primary); }
  .modal textarea { min-height: 80px; font-family: inherit; width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
  .modal-actions button { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
  .modal-actions .save { background: var(--primary); color: #fff; } .modal-actions .cancel { background: #95a5a6; color: #fff; }
</style>
</head>
<body>
<div class="container" style="max-width: 1200px;">
  <div class="admin-header">
    <h1>⚙️ Zarządzanie bazą pytań <span id="total-count" class="count-badge">0</span></h1>
    <div class="actions">
      <a href="/">← Powrót do egzaminu</a>
      <button id="export-btn">⬇️ Eksport JSON</button>
      <button id="import-btn">⬆️ Import JSON</button>
      <button id="add-btn" style="background: var(--primary);">➕ Dodaj pytanie</button>
      <button class="danger" onclick="logout()">Wyloguj</button>
    </div>
  </div>
  <div class="filters">
    <select id="filter-category"><option value="">Wszystkie kategorie</option><option value="regulamin">Regulamin</option><option value="kody">Kody radiowe</option><option value="medycyna">Medycyna</option></select>
    <input type="text" id="filter-search" placeholder="Szukaj w pytaniach...">
  </div>
  <div style="overflow-x:auto;">
    <table><thead><tr><th style="width:50px;">ID</th><th style="width:100px;">Kategoria</th><th style="width:80px;">Rangi</th><th>Pytanie</th><th>Odpowiedź</th><th style="width:130px;">Akcje</th></tr></thead><tbody id="questions-tbody"></tbody></table>
  </div>
</div>
<div class="modal-bg" id="modal">
  <div class="modal">
    <h3 id="modal-title">Dodaj pytanie</h3>
    <input type="hidden" id="edit-id">
    <div class="form-group"><label>Kategoria</label><select id="edit-category"><option value="regulamin">Regulamin</option><option value="kody">Kody radiowe</option><option value="medycyna">Medycyna</option></select></div>
    <div class="form-group" style="display:flex; gap:10px;"><div style="flex:1;"><label>Ranga min</label><input type="number" id="edit-rank-min" min="1" max="13" value="1" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:5px;"></div><div style="flex:1;"><label>Ranga max</label><input type="number" id="edit-rank-max" min="1" max="13" value="13" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:5px;"></div></div>
    <div class="form-group"><label>Pytanie</label><textarea id="edit-question"></textarea></div>
    <div class="form-group"><label>Odpowiedź</label><textarea id="edit-answer"></textarea></div>
    <div class="modal-actions"><button class="cancel" onclick="closeModal()">Anuluj</button><button class="save" onclick="saveQuestion()">Zapisz</button></div>
  </div>
</div>
<script src="/admin.js"></script>
</body>
</html>
